# Settings shared by every version, then one section per Minecraft version.
mod.id = "gsm"
mod.name = "Generic Storage Mod"
mod.group = "com.zyria.gsm"
mod.version = "1.1.1"

deps.fabric_loader = "0.20.1"
loomx.loom_version = "1.19-SNAPSHOT"

["26.1.2"]
# Built against 26.1.2; patch releases don't change anything this mod uses.
mod.mc_compat = ">=26.1 <26.2"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
deps.fabric_api = "0.155.3+26.1.2"

["26.2"]
# Versions this jar works on (fabric.mod.json) and the ones to tick on Modrinth/CurseForge.
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]
deps.fabric_api = "0.161.0+26.2"

["26.3"]
mod.mc_compat = "~26.3"
mod.mc_releases = ["26.3"]
deps.fabric_api = "0.166.2+26.3"
